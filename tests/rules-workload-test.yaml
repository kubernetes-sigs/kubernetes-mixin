        value: 3
    - eval_time: 2m
      expr: namespace_workload:kube_pods_desired:sum
      exp_samples:
      - labels: 'namespace_workload:kube_pods_desired:sum{cluster="test",namespace="default",workload="scaled-deployment",workload_type="deployment"}'
        value: 0

  # Keep desired counts isolated for multiple workloads in one namespace.
  - interval: 1m
    input_series:
    - series: 'kube_deployment_spec_replicas{cluster="test",namespace="default",deployment="deployment-a",job="kube-state-metrics",instance="ksm-1"}'
      values: '2 2'
    - series: 'kube_deployment_spec_replicas{cluster="test",namespace="default",deployment="deployment-b",job="kube-state-metrics",instance="ksm-1"}'
