    - series: 'kube_statefulset_replicas{cluster="test",namespace="default",statefulset="desired-statefulset",job="kube-state-metrics",instance="ksm-1"}'
      values: '6 6'
    - series: 'kube_statefulset_replicas{cluster="test",namespace="default",statefulset="desired-statefulset",job="kube-state-metrics",instance="ksm-2"}'
      values: '6 6'

    promql_expr_test:
    - eval_time: 1m
      expr: namespace_workload:kube_pod_owner:derived
    - eval_time: 1m
      expr: namespace_workload:kube_pods_ready:sum
    - eval_time: 1m
      expr: namespace_workload:kube_pods_phase:sum
    - eval_time: 1m
      expr: namespace_workload:kube_pods_desired:sum
      exp_samples:
      - labels: 'namespace_workload:kube_pods_desired:sum{cluster="test",namespace="default",workload="desired-daemonset",workload_type="daemonset"}'
        value: 2
      - labels: 'namespace_workload:kube_pods_desired:sum{cluster="test",namespace="default",workload="desired-deployment",workload_type="deployment"}'
        value: 3
      - labels: 'namespace_workload:kube_pods_desired:sum{cluster="test",namespace="default",workload="desired-standalone-replicaset",workload_type="replicaset"}'
        value: 5
      - labels: 'namespace_workload:kube_pods_desired:sum{cluster="test",namespace="default",workload="desired-statefulset",workload_type="statefulset"}'
        value: 6

  # Do not record a Deployment-owned ReplicaSet as a standalone workload.
  - interval: 1m
    input_series:
    - series: 'kube_deployment_spec_replicas{cluster="test",namespace="default",deployment="deployment-with-owned-replicaset",job="kube-state-metrics",instance="ksm-1"}'
