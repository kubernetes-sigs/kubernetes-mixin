rule_files:
- ../prometheus_rules.yaml

evaluation_interval: 1m

tests:
  # Prefer the controller owner when a pod has multiple owner references
  - interval: 1m
    input_series:
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="controller-reference-daemonset-pod",owner_is_controller="true",owner_kind="DaemonSet",owner_name="controller-reference-daemonset",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="controller-reference-daemonset-pod",owner_is_controller="false",owner_kind="ConfigMap",owner_name="non-controller-config-reference",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="controller-reference-daemonset-pod",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="controller-reference-daemonset-pod",phase="Running",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'

    promql_expr_test:
    - eval_time: 1m
      expr: namespace_workload:kube_pod_owner:derived
      exp_samples:
      - labels: 'namespace_workload:kube_pod_owner:derived{cluster="test",namespace="default",workload="controller-reference-daemonset",workload_type="daemonset",workload_is_controller="true"}'
        value: 1
    - eval_time: 1m
      expr: namespace_workload:kube_pods_ready:sum
      exp_samples:
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="default",workload="controller-reference-daemonset",workload_type="daemonset",workload_is_controller="true"}'
        value: 1
    - eval_time: 1m
      expr: namespace_workload:kube_pods_phase:sum
      exp_samples:
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Running",workload="controller-reference-daemonset",workload_type="daemonset",workload_is_controller="true"}'
        value: 1

  # Record ready pods for each built-in workload ownership path.
  - interval: 1m
    input_series:
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="deployment-pod-a",owner_is_controller="true",owner_kind="ReplicaSet",owner_name="deployment-rs",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="deployment-pod-a",owner_is_controller="true",owner_kind="ReplicaSet",owner_name="deployment-rs",job="kube-state-metrics",instance="ksm-2"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="deployment-pod-a",owner_is_controller="false",owner_kind="ConfigMap",owner_name="non-controller-config-reference",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_replicaset_owner{cluster="test",namespace="default",replicaset="deployment-rs",owner_is_controller="true",owner_kind="Deployment",owner_name="deployment",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_replicaset_owner{cluster="test",namespace="default",replicaset="deployment-rs",owner_is_controller="true",owner_kind="Deployment",owner_name="deployment",job="kube-state-metrics",instance="ksm-2"}'
      values: '1 1'
    - series: 'kube_replicaset_owner{cluster="test",namespace="default",replicaset="deployment-rs",owner_is_controller="false",owner_kind="Rollout",owner_name="non-controller-rollout-reference",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="deployment-pod-a",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="deployment-pod-a",condition="true",job="kube-state-metrics",instance="ksm-2"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="deployment-pod-a",phase="Running",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="deployment-pod-b",owner_is_controller="true",owner_kind="ReplicaSet",owner_name="deployment-rs",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="deployment-pod-b",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '0 0'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="standalone-replicaset-pod",owner_is_controller="true",owner_kind="ReplicaSet",owner_name="standalone-replicaset",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_replicaset_owner{cluster="test",namespace="default",replicaset="standalone-replicaset",owner_kind="",owner_name="",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="standalone-replicaset-pod",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="standalone-replicaset-pod",phase="Pending",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="statefulset-pod",owner_is_controller="true",owner_kind="StatefulSet",owner_name="statefulset",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="statefulset-pod",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="statefulset-pod",phase="Running",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="standalone-job-pod",owner_is_controller="true",owner_kind="Job",owner_name="standalone-job",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_job_owner{cluster="test",namespace="default",job_name="standalone-job",owner_kind="",owner_name="",owner_is_controller="",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="standalone-job-pod",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="standalone-job-pod",phase="Succeeded",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="pod-owned-job-pod",owner_is_controller="true",owner_kind="Job",owner_name="pod-owned-job-child-a",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_job_owner{cluster="test",namespace="default",job_name="pod-owned-job-child-a",owner_kind="Pod",owner_name="pod-owned-job",owner_is_controller="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_job_owner{cluster="test",namespace="default",job_name="pod-owned-job-child-a",owner_kind="Pod",owner_name="pod-owned-job",owner_is_controller="true",job="kube-state-metrics",instance="ksm-2"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="pod-owned-job-pod",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="pod-owned-job-pod",phase="Running",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    promql_expr_test:
    - eval_time: 1m
      expr: namespace_workload:kube_pod_owner:derived
      exp_samples:
      - labels: 'namespace_workload:kube_pod_owner:derived{cluster="test",namespace="default",workload="deployment",workload_type="deployment",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pod_owner:derived{cluster="test",namespace="default",workload="standalone-replicaset",workload_type="replicaset",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pod_owner:derived{cluster="test",namespace="default",workload="statefulset",workload_type="statefulset",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pod_owner:derived{cluster="test",namespace="default",workload="pod-owned-job",workload_type="pod",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pod_owner:derived{cluster="test",namespace="default",workload="standalone-job",workload_type="job",workload_is_controller="true"}'
        value: 1
    - eval_time: 1m
      expr: namespace_workload:kube_pods_ready:sum
      exp_samples:
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="default",workload="deployment",workload_type="deployment",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="default",workload="standalone-replicaset",workload_type="replicaset",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="default",workload="statefulset",workload_type="statefulset",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="default",workload="standalone-job",workload_type="job",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="default",workload="pod-owned-job",workload_type="pod",workload_is_controller="true"}'
        value: 1
    - eval_time: 1m
      expr: namespace_workload:kube_pods_phase:sum
      exp_samples:
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Pending",workload="standalone-replicaset",workload_type="replicaset",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Running",workload="deployment",workload_type="deployment",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Running",workload="statefulset",workload_type="statefulset",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Running",workload="pod-owned-job",workload_type="pod",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Succeeded",workload="standalone-job",workload_type="job",workload_is_controller="true"}'
        value: 1

  # Record ready pods for custom controllers and Jobs without a controller owner.
  - interval: 1m
    input_series:
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="custom-pod-controller-pod",owner_is_controller="true",owner_kind="StrimziPodSet",owner_name="custom-pod-controller",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="custom-pod-controller-pod",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="custom-pod-controller-pod",phase="Running",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="custom-job-controller-pod-a",owner_is_controller="true",owner_kind="Job",owner_name="custom-job-controller-job-a",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_job_owner{cluster="test",namespace="default",job_name="custom-job-controller-job-a",owner_kind="CronJob",owner_name="custom-job-controller",owner_is_controller="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="custom-job-controller-pod-a",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="custom-job-controller-pod-a",phase="Running",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="job-with-non-controller-owner-pod",owner_is_controller="true",owner_kind="Job",owner_name="job-with-non-controller-owner",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_job_owner{cluster="test",namespace="default",job_name="job-with-non-controller-owner",owner_kind="Pod",owner_name="non-controller-pod-owner",owner_is_controller="false",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="job-with-non-controller-owner-pod",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="job-with-non-controller-owner-pod",phase="Running",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="custom-replicaset-controller-pod-a",owner_is_controller="true",owner_kind="ReplicaSet",owner_name="custom-replicaset-controller-rs-a",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_replicaset_owner{cluster="test",namespace="default",replicaset="custom-replicaset-controller-rs-a",owner_kind="Rollout",owner_name="custom-replicaset-controller",owner_is_controller="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="custom-replicaset-controller-pod-a",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="custom-replicaset-controller-pod-a",phase="Running",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_replicaset_spec_replicas{cluster="test",namespace="default",replicaset="custom-replicaset-controller-rs-a",job="kube-state-metrics",instance="ksm-1"}'
      values: '2 2'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="custom-job-controller-pod-b",owner_is_controller="true",owner_kind="Job",owner_name="custom-job-controller-job-b",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_job_owner{cluster="test",namespace="default",job_name="custom-job-controller-job-b",owner_kind="CronJob",owner_name="custom-job-controller",owner_is_controller="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="custom-job-controller-pod-b",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '0 0'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="custom-job-controller-pod-b",phase="Succeeded",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="custom-replicaset-controller-pod-b",owner_is_controller="true",owner_kind="ReplicaSet",owner_name="custom-replicaset-controller-rs-b",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_replicaset_owner{cluster="test",namespace="default",replicaset="custom-replicaset-controller-rs-b",owner_kind="Rollout",owner_name="custom-replicaset-controller",owner_is_controller="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="custom-replicaset-controller-pod-b",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="custom-replicaset-controller-pod-b",phase="Running",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_replicaset_spec_replicas{cluster="test",namespace="default",replicaset="custom-replicaset-controller-rs-b",job="kube-state-metrics",instance="ksm-1"}'
      values: '3 3'

    promql_expr_test:
    - eval_time: 1m
      expr: namespace_workload:kube_pod_owner:derived
      exp_samples:
      - labels: 'namespace_workload:kube_pod_owner:derived{cluster="test",namespace="default",workload="custom-job-controller",workload_type="CronJob",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pod_owner:derived{cluster="test",namespace="default",workload="custom-pod-controller",workload_type="StrimziPodSet",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pod_owner:derived{cluster="test",namespace="default",workload="custom-replicaset-controller",workload_type="Rollout",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pod_owner:derived{cluster="test",namespace="default",workload="job-with-non-controller-owner",workload_type="job",workload_is_controller="true"}'
        value: 1
    - eval_time: 1m
      expr: namespace_workload:kube_pods_ready:sum
      exp_samples:
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="default",workload="custom-job-controller",workload_type="CronJob",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="default",workload="custom-pod-controller",workload_type="StrimziPodSet",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="default",workload="custom-replicaset-controller",workload_type="Rollout",workload_is_controller="true"}'
        value: 2
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="default",workload="job-with-non-controller-owner",workload_type="job",workload_is_controller="true"}'
        value: 1
    - eval_time: 1m
      expr: namespace_workload:kube_pods_phase:sum
      exp_samples:
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Running",workload="custom-job-controller",workload_type="CronJob",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Running",workload="custom-pod-controller",workload_type="StrimziPodSet",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Running",workload="custom-replicaset-controller",workload_type="Rollout",workload_is_controller="true"}'
        value: 2
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Running",workload="job-with-non-controller-owner",workload_type="job",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Succeeded",workload="custom-job-controller",workload_type="CronJob",workload_is_controller="true"}'
        value: 1
    - eval_time: 1m
      expr: namespace_workload:kube_pods_desired:sum{workload=~"custom-replicaset-controller.*"}

  # Preserve bare and static pod workloads without accepting non-controller owners.
  - interval: 1m
    input_series:
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="bare-pod",owner_is_controller="",owner_kind="",owner_name="",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="bare-pod",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="bare-pod",phase="Running",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="kube-system",pod="static-pod",owner_is_controller="true",owner_kind="Node",owner_name="node-1",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="kube-system",pod="static-pod",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="kube-system",pod="static-pod",phase="Running",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="referenced-pod",owner_is_controller="false",owner_kind="ConfigMap",owner_name="pod-config",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="referenced-pod",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'

    promql_expr_test:
    - eval_time: 1m
      expr: namespace_workload:kube_pod_owner:derived
      exp_samples:
      - labels: 'namespace_workload:kube_pod_owner:derived{cluster="test",namespace="default",workload="bare-pod",workload_type="barepod",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pod_owner:derived{cluster="test",namespace="kube-system",workload="static-pod",workload_type="staticpod",workload_is_controller="true"}'
        value: 1
    - eval_time: 1m
      expr: namespace_workload:kube_pods_ready:sum
      exp_samples:
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="default",workload="bare-pod",workload_type="barepod",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="kube-system",workload="static-pod",workload_type="staticpod",workload_is_controller="true"}'
        value: 1
    - eval_time: 1m
      expr: namespace_workload:kube_pods_phase:sum
      exp_samples:
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Running",workload="bare-pod",workload_type="barepod",workload_is_controller="true"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="kube-system",phase="Running",workload="static-pod",workload_type="staticpod",workload_is_controller="true"}'
        value: 1

  # Aggregate all pod phases without double-counting redundant KSM producers.
  - interval: 1m
    input_series:
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="lifecycle-deployment-pod-a",owner_is_controller="true",owner_kind="ReplicaSet",owner_name="lifecycle-deployment-rs",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1 1'
