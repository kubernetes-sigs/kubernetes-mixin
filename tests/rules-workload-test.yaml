    - series: 'kube_daemonset_status_desired_number_scheduled{cluster="test",namespace="default",daemonset="desired-daemonset",job="kube-state-metrics",instance="ksm-2"}'
      values: '2 2'
    - series: 'kube_deployment_spec_replicas{cluster="test",namespace="default",deployment="desired-deployment",job="kube-state-metrics",instance="ksm-1"}'
      values: '3 3'
    - series: 'kube_replicaset_spec_replicas{cluster="test",namespace="default",replicaset="desired-standalone-replicaset",job="kube-state-metrics",instance="ksm-1"}'
