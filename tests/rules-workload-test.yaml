  # Keep desired workloads without observed pods, including scale transitions through zero.
  - interval: 1m
    input_series:
    - series: 'kube_deployment_spec_replicas{cluster="test",namespace="default",deployment="scaled-deployment",job="kube-state-metrics",instance="ksm-1"}'
      values: '0 3 0'

